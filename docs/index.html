<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="description" content="여러 AI 서비스의 사용량을 한눈에 확인하는 대시보드" />
    <title>AI Usage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2 4.3 6.4v8.9L12 22l7.7-6.7V6.4L12 2Zm0 3.2 4.9 2.8-4.9 2.8L7.1 8 12 5.2Zm-5.2 5.3 3.7 2.1v5.2l-3.7-3.2v-4.1Zm6.7 7.3v-5.2l3.7-2.1v4.1l-3.7 3.2Z"/></svg>
          </span>
          <div><h1>AI Usage</h1><p>모든 AI 사용량을 한눈에</p></div>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="테마 변경">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <main>
        <section class="overview" aria-labelledby="overview-title">
          <div><p class="eyebrow">전체 현황</p><h2 id="overview-title"><strong id="activeCount">5</strong>개 서비스 연결됨</h2></div>
          <button class="refresh-button" id="refreshButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            <span>새로고침</span>
          </button>
        </section>
        <p class="updated" id="globalUpdated"><span class="live-dot"></span>방금 전 업데이트</p>

        <section class="provider-card" aria-live="polite">
          <div class="provider-head">
            <div class="provider-identity">
              <span class="provider-logo" id="providerLogo" aria-hidden="true">C</span>
              <div><h2 id="providerName">Copilot</h2><p id="providerStatus">정상적으로 연결됨</p></div>
            </div>
            <button class="more-button" type="button" aria-label="더 보기">•••</button>
          </div>
          <div class="metrics" id="metrics"></div>
          <div class="reset-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div><span>다음 사용량 재설정</span><strong id="resetDate">9월 1일 오전 9:00</strong></div>
          </div>
        </section>

        <section class="tip-card">
          <span class="sparkle" aria-hidden="true">✦</span>
          <div><strong>사용량을 효율적으로 관리하세요</strong><p>사용량이 80%를 넘으면 알림을 보내드릴게요.</p></div>
          <button type="button" aria-label="알림 설정">›</button>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="AI 서비스 선택">
        <div class="nav-track" id="providerNav"></div>
      </nav>
    </div>
    <script src="app.js"></script>
  </body>
</html>
