<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="description" content="여러 AI 서비스의 사용량을 한눈에 확인하는 대시보드" />
    <title>AI Usage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2 4.3 6.4v8.9L12 22l7.7-6.7V6.4L12 2Zm0 3.2 4.9 2.8-4.9 2.8L7.1 8 12 5.2Zm-5.2 5.3 3.7 2.1v5.2l-3.7-3.2v-4.1Zm6.7 7.3v-5.2l3.7-2.1v4.1l-3.7 3.2Z"/></svg>
          </span>
          <div><h1>AI Usage</h1><p>모든 AI 사용량을 한눈에</p></div>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="settingsToggle" type="button" aria-label="계정 및 API 설정">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          </button>
          <button class="icon-button" id="themeToggle" type="button" aria-label="테마 변경">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <nav class="top-nav" aria-label="AI 서비스 선택">
        <div class="nav-track" id="providerNav"></div>
      </nav>

      <main>
        <section class="overview" aria-labelledby="overview-title">
          <div><p class="eyebrow">전체 현황</p><h2 id="overview-title"><strong id="activeCount">5</strong>개 서비스 연결됨</h2></div>
          <button class="refresh-button" id="refreshButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            <span>새로고침</span>
          </button>
        </section>
        <p class="updated" id="globalUpdated"><span class="live-dot"></span>방금 전 업데이트</p>

        <section class="provider-card" aria-live="polite">
          <div class="provider-head">
            <div class="provider-identity">
              <span class="provider-logo" id="providerLogo" aria-hidden="true">C</span>
              <div><h2 id="providerName">Copilot</h2><p id="providerStatus">정상적으로 연결됨</p></div>
            </div>
            <span class="data-badge" id="dataBadge" title="데이터 출처">예시</span>
          </div>
          <div class="metrics" id="metrics"></div>
          <div class="reset-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div><span>다음 사용량 재설정</span><strong id="resetDate">9월 1일 오전 9:00</strong></div>
          </div>
        </section>

        <section class="tip-card" id="tipCard">
          <span class="sparkle" aria-hidden="true">✦</span>
          <div><strong id="tipTitle">사용량을 효율적으로 관리하세요</strong><p id="tipBody">사용량이 80%를 넘으면 알림을 보내드릴게요.</p></div>
          <button type="button" id="tipAction" aria-label="계정 연결">›</button>
        </section>
      </main>
    </div>

    <!-- 계정 · API 설정 -->
    <div class="modal-backdrop" id="settingsModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="modal-head">
          <h2 id="settingsTitle">계정 · API 연결</h2>
          <button class="icon-button" id="settingsClose" type="button" aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <p class="modal-hint">
          각 서비스의 <strong>API 키/토큰</strong>을 저장하면 프록시 서버를 통해 실제 사용량을 조회합니다.
          키는 이 브라우저(localStorage)에만 저장됩니다.
        </p>
        <label class="field">
          <span>프록시 서버 주소</span>
          <input type="url" id="proxyUrl" placeholder="http://localhost:8787" autocomplete="off" spellcheck="false" />
          <small>실제 조회를 하려면 <code>server/proxy.js</code>를 실행하세요. 비워두면 예시 데이터를 표시합니다.</small>
        </label>
        <div id="credForms"></div>
        <footer class="modal-foot">
          <button class="ghost-button" id="settingsClear" type="button">이 서비스 키 삭제</button>
          <button class="primary-button" id="settingsSave" type="button">저장하고 조회</button>
        </footer>
      </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
